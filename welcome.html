<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amazon Keyword Tool — you're set</title>
<link rel="icon" type="image/png" sizes="48x48" href="/favicon.png">
<!-- Один внешний скрипт — welcome.js, и только ради локализации: текст живёт
     в _locales, иначе английский вшит в разметку и переводить нечего. Inline
     по-прежнему нет, его запрещает CSP MV3.

     ⚠️ У страницы ОДНА задача — показать, где найти расширение после установки.
     Не «как пользоваться». Отсюда ровно два блока: третий убивает страницу
     целиком — человек неосознанно оценивает объём и закрывает, не читая
     (`docs/course-method.md` → Welcome page). Прежние шаги про Find keywords,
     Count competing products и CSV сняты: дыру онбординга закрывают четыре
     постоянные поверхности интерфейса (F24, F30), а не блоки здесь.

     ⚠️ Цифры и стрелки живут ВНУТРИ картинок шагов, а не в разметке. Метод
     требует и того, и другого; макеты пришли с готовыми метками 1-2-3 и
     подписями к ним, поэтому подпись блока на странице говорит не про клик,
     а про его смысл — иначе одно и то же сказано дважды подряд.

     ⚠️ Кегли, ширина макета и ритм сняты ЗАМЕРОМ с образца, названного
     владельцем 26.08 (`mp4-to-mp3.pro/welcome`): текст 20/32.5, макет 675 px,
     между подписью и её картинкой 48 px. Заголовок у образца 48 px, у нас 40 —
     его имя длиннее и в 48 не помещается в одну строку, см. замер у правила h1.
     Своей иконки над заголовком нет, подзаголовка тоже нет — оба сняты
     решением владельца 26.08. На странице остались ТОЛЬКО заголовок и два
     блока: меньше уже не разобрать на части.

     ⚠️ Ноль анимаций и переходов — по методу (движение режет конверсию) и
     потому, что блок `prefers-reduced-motion` нужен каждому анимированному
     селектору (E27). Анимаций нет — дублировать нечего. Ноль кнопок призыва
     и ссылок: человек жмёт «начать» и уходит, ТАК И НЕ ЗАКРЕПИВ.

     Обе темы объявлены. Инструкция целиком лежит внутри картинок, а они
     светлые в любой теме: тёмная меняет только фон страницы и текст вокруг,
     и оторванность картинки от фона от этого не страдает, а растёт. -->
<style>
  :root {
    /* Согласие на обе схемы — иначе нативные контролы остаются в светлой
       схеме поверх тёмного фона (E17, та же причина, что в app.css). */
    color-scheme: light dark;

    /* Фон страницы. Значение измерено, а не подобрано: метод требует, чтобы
       фон страницы НЕ совпадал с фоном скриншота, иначе скрин перестаёт
       читаться как картинка и сливается со страницей. Холст макетов —
       #faf9f6, ΔE2000 до него 9.24 при пороге 8. Тон 167° — та же бирюзовая
       семья, что акцент продукта; оранжевого нет нигде, это цвет Amazon и
       намёк на аффилиацию плохо читается на модерации.

       ⚠️ Светлый фон, в отличие от тёмного, у попапа взять НЕЛЬЗЯ: его
       #f4f6f8 отстоит от холста на ΔE2000 2.77 при пороге 8.

       ⚠️ Градиент здесь БЫЛ и снят решением владельца 26.08. Замер, ради
       которого он заводился, остаётся полезным и записан в F38: осветлять
       мятный нельзя ни при каком приёме — #e3efec даёт ΔE 6.37, #e8f2ef 5.36,
       #edf5f3 4.26, все ниже порога 8. Понадобится когда-нибудь светлее —
       это про порог метода, а не про вкус. */
    --bg: #d6e8e4;      /* ΔE2000 до холста картинки 9.24 при пороге 8 */
    --text: #0f1e1c;    /* контраст к фону 13.51 при пороге 7 */
    --muted: #3e5551;   /* контраст к фону 6.30 при пороге 4.5 */
    --lift: 0 1px 2px rgba(15, 30, 28, .07), 0 10px 28px rgba(15, 30, 28, .10);
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    /* Тёмная палитра НЕ своя — взята из `app.css` байт в байт. Прежняя
       (#101f1d) была выведена из бирюзы продукта и на всю страницу читалась
       болотом: тон 172° при светлоте 9 % — решение владельца 26.08 её снять.
       Брать у попапа правильнее, чем подбирать заново: welcome и интерфейс
       обязаны выглядеть одним продуктом, а у попапа значения уже измерены.
       ⚠️ Совпадение, которого не планировали: тон фона 216° — тот же, что у
       стрелок и меток внутри макетов (#1a6fe8, 215.2°). Страница и картинка
       на ней оказались в одной холодной семье. */
    :root {
      /* #161c25 — выбор владельца 26.08; в попапе это --surface, а не --bg.
         Тон 216°, светлота 11.6 %: холодный сланец, не бирюза. Текст и
         приглушённый взяты у попапа и на этом фоне оба проходят пороги. */
      --bg: #161c25;    /* ΔE2000 до холста картинки 84.84 при пороге 8 */
      --text: #e4e9f0;  /* контраст к фону 14.03 при пороге 7 */
      --muted: #8592a6; /* контраст к фону 5.43 при пороге 4.5 */
      --lift: 0 1px 2px rgba(0, 0, 0, .40), 0 10px 28px rgba(0, 0, 0, .45);
    }
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    /* ⚠️ Каждый цвет фона обязан приезжать ТОКЕНОМ, а не литералом: сторож
       разбирает это правило, достаёт из него все `var(--…)` и меряет ΔE и
       контраст у каждого найденного цвета. Впишешь hex прямо сюда — он уедет
       мимо замера, и проверка станет зелёной ни о чём (F38). Правило
       переживает и один цвет, и градиент: список задаёт разметка. */
    background: var(--bg);
    min-height: 100vh;
    color: var(--text);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    padding: 72px 24px;
    text-align: center;
  }
  /* Потолок колонки — он же отрисованная ширина картинки шага. Число снято
     с образца `mp4-to-mp3.pro/welcome` (задание владельца 26.08): там макет
     отрисован ровно 675 px. Число не декоративное: подсветка цели клика
     занимает на нашем холсте 1350 px 110 px, то есть при колонке 675
     отрисуется как 55.0 CSS px при пороге метода 24. Значит цель перестанет
     читаться только при колонке уже ~295 px — на любом окне, где страница
     вообще открывается, запас двукратный. Замер не записан руками — его делает
     `test/f38-welcome.mjs`, распаковывая этот самый PNG (F38). */
  main { max-width: 675px; margin: 0 auto; }

  /* 40 px, а не 48 с образца: при 48 заголовок целиком занимает 791 px и в
     колонку 675 не влезает — «Amazon Keyword Tool» разрывается пополам. Замер
     на этом же шрифте: 48 → 791, 42 → 694, 40 → 662, 38 → 629. Взято 40 —
     самый крупный кегль, помещающийся в 675 с запасом 13 px.
     ⚠️ `text-wrap: balance` СНЯТ намеренно. Пока заголовок жил в две строки,
     он их уравнивал; теперь строка одна, а на чужом шрифте (Segoe UI шире
     системного macOS) balance разложил бы её ровно пополам — то есть разорвал
     бы имя продукта. Обычный перенос в этом случае отрывает только
     «installed», а имя остаётся целым. */
  h1 { font-size: 40px; line-height: 1.25; font-weight: 700; margin: 0 auto; }

  .steps { list-style: none; padding: 0; margin-top: 40px; }
  .steps li + li { margin-top: 48px; }
  .cap { font-size: 20px; line-height: 1.625; font-weight: 500; color: var(--muted); margin-bottom: 48px; }
  /* Скругление повторяет скругление самих макетов: у них прозрачные углы,
     первый непрозрачный пиксель ряда 0 стоит на x = 22 при холсте 1350, то
     есть 11.0 CSS px при колонке 675. Без своего радиуса мягкая подложка
     легла бы ПРЯМОУГОЛЬНИКОМ под прозрачными углами картинки и обвела бы
     пустоту. */
  .shot { display: block; width: 100%; height: auto; border-radius: 11px; box-shadow: var(--lift); }
</style>
</head>
<!--
  Страница после установки расширения Amazon Keyword Tool.

  Живёт на своём домене, а не в билде (решение владельца 02.09.2026,
  развилка №4). Правится без новой версии и без модерации — в этом и был
  смысл переезда.

  ⚠️ Текст ВШИТ в разметку намеренно. В билде он приходил из _locales через
  chrome.i18n.getMessage, но на обычном сайте этого API нет: скрипт молча
  оставил бы страницу пустой. Источник строк — akt/_locales/en/messages.json
  до K3; интерфейс продукта английский (развилка №5), переводить нечего.

  ⚠️ Скриптов на странице нет ни одного, и это часть решения: считать ей
  нечего, а аналитика — отдельное решение со своей записью в политике.
-->
<body>
<main>
  <h1>🔍 Amazon Keyword Tool is installed</h1>

  <ol class="steps">
    <li>
      <p class="cap">Pin <b>Amazon Keyword Tool</b> so it's always one click away:</p>
      <img class="shot" src="img/step-1.png" width="1350" height="844" alt="Chrome toolbar: click the extensions puzzle icon, then click the pin next to Amazon Keyword Tool.">
    </li>
    <li>
      <p class="cap">Then click the pinned icon — it opens in a new tab:</p>
      <img class="shot" src="img/step-2.png" width="1350" height="844" alt="Chrome toolbar with Amazon Keyword Tool pinned: click its icon to open the tool.">
    </li>
  </ol>
</main>
</body>
</html>
